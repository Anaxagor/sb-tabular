# Search space for `dsbm_ct_joint_gbt` (production). Every key must be consumed by the model adapter (strict):
# an unknown key is rejected before the study starts. The training budget is a declared part of the
# trial configuration. `noise` is deliberately absent: dropping the dynamics noise of a
# stochastic-drift model is not a marginal-preserving sampler.
model: dsbm_ct_joint_gbt
kind: production
version: 1
fixed:
  first_coupling: ind
  cb_thread_count: 4
params:
  sigma:
    type: float
    low: 0.05
    high: 1.0
    log: true
  n_stages:
    type: categorical
    choices:
    - 3
    - 5
    - 7
  cb_iterations:
    type: categorical
    choices:
    - 300
    - 600
    - 1000
  cb_depth:
    type: int
    low: 4
    high: 8
  cb_learning_rate:
    type: float
    low: 0.03
    high: 0.2
    log: true
  num_steps:
    type: categorical
    choices:
    - 50
    - 100
    - 200
  n_noise_per_pair:
    type: categorical
    choices:
    - 2
    - 4
    - 8
