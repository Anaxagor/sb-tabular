model: forestdiffusion
kind: production
version: 1
fixed:
  diffusion_type: vp
  device: cpu
  n_jobs: 1
  n_threads: 4
  n_batch: 8
params:
  n_t:
    type: categorical
    choices: [20, 50, 100]
  n_estimators:
    type: categorical
    choices: [100, 300]
  max_depth:
    type: int
    low: 3
    high: 7
  eta:
    type: float
    low: 0.03
    high: 0.3
    log: true
  duplicate_K:
    type: categorical
    choices: [10, 50, 100]
