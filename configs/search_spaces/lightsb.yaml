# Search space for `lightsb` (production). Every key must be consumed by the model adapter (strict):
# an unknown key is rejected before the study starts. The training budget is a declared part of the
# trial configuration. `noise` is deliberately absent: dropping the dynamics noise of a
# stochastic-drift model is not a marginal-preserving sampler.
model: lightsb
kind: production
version: 1
fixed:
  device: cpu
  use_sde_sampling: false
  init_r_from_data: true
params:
  n_potentials:
    type: categorical
    choices:
    - 16
    - 32
    - 64
    - 128
  epsilon:
    type: float
    low: 0.01
    high: 1.0
    log: true
  S_diagonal_init:
    type: float
    low: 0.03
    high: 0.3
    log: true
  lr:
    type: float
    low: 0.0003
    high: 0.01
    log: true
  batch_size:
    type: categorical
    choices:
    - 128
    - 256
    - 512
  max_iter:
    type: categorical
    choices:
    - 5000
    - 10000
    - 20000
