# Search space for `tabpfgen` (production). Every key must be consumed by the model adapter (strict):
# an unknown key is rejected before the study starts. The training budget is a declared part of the
# trial configuration.
model: tabpfgen
kind: production
version: 1
fixed:
  device: cpu
  use_quantiles: true
params:
  n_sgld_steps:
    type: categorical
    choices:
    - 250
    - 500
    - 1000
  sgld_step_size:
    type: float
    low: 0.001
    high: 0.05
    log: true
  sgld_noise_scale:
    type: float
    low: 0.001
    high: 0.05
    log: true
