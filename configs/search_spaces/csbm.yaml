# Search space for `csbm` (production). Every key must be consumed by the model adapter (strict):
# an unknown key is rejected before the study starts. The training budget is a declared part of the
# trial configuration. `noise` is deliberately absent: dropping the dynamics noise of a
# stochastic-drift model is not a marginal-preserving sampler.
model: csbm
kind: production
version: 2
fixed:
  device: cpu
params:
  n_layers:
    type: categorical
    choices: [2, 3, 4, 5, 6]
  dropout:
    type: float
    low: 0.0
    high: 0.3
  num_outer_iterations:
    type: categorical
    choices:
    - 2
    - 3
    - 4
  epochs:
    type: categorical
    choices:
    - 10
    - 20
    - 40
  num_steps:
    type: categorical
    choices:
    - 25
    - 50
    - 100
  mixing_rate:
    type: float
    low: 0.5
    high: 8.0
    log: true
  ordered_bandwidth:
    type: float
    low: 0.1
    high: 0.6
  forward_lr:
    type: float
    low: 0.0001
    high: 0.003
    log: true
  backward_lr:
    type: float
    low: 0.0001
    high: 0.003
    log: true
  forward_weight_decay:
    type: float
    low: 0.000001
    high: 0.01
    log: true
  backward_weight_decay:
    type: float
    low: 0.000001
    high: 0.01
    log: true
  batch_size:
    type: categorical
    choices:
    - 128
    - 256
    - 512
  hidden_dim:
    type: categorical
    choices:
    - 128
    - 256
    - 512
