# Search space for `csbm_annealed` (smoke). HEURISTIC variant: the reference mixing rate is annealed between outer
# iterations, so this is NOT the canonical fixed-reference CSBM (use `csbm` for that).
model: csbm_annealed
kind: smoke
version: 2
fixed:
  num_outer_iterations: 2
  epochs: 2
  num_steps: 6
  hidden_dim: 32
  n_layers: 3
  dropout: 0.1
  forward_weight_decay: 0.0001
  backward_weight_decay: 0.002
  emb_dim: 4
  time_dim: 16
  device: cpu
  anneal_every: 1
  anneal_multiplier: 0.5
params:
  mixing_rate:
    type: float
    low: 0.5
    high: 4.0
    log: true
  forward_lr:
    type: float
    low: 0.001
    high: 0.003
    log: true
  backward_lr:
    type: float
    low: 0.004
    high: 0.01
    log: true
