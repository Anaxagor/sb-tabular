# Search space for `dsb_ct_joint_mlp` (smoke). Every key must be consumed by the model adapter (strict):
# an unknown key is rejected before the study starts. The training budget is a declared part of the
# trial configuration. `noise` is deliberately absent: dropping the dynamics noise of a
# stochastic-drift model is not a marginal-preserving sampler.
model: dsb_ct_joint_mlp
kind: smoke
version: 1
fixed:
  ipf_iters: 2
  num_steps: 6
  steps_per_phase: 20
  cache_batches: 2
  batch_size: 64
  hidden_units: 16
  n_layers: 2
  time_features: 8
  device: cpu
params:
  horizon:
    type: float
    low: 0.5
    high: 1.0
  lr:
    type: float
    low: 0.001
    high: 0.01
    log: true
