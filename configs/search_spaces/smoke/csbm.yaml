# Search space for `csbm` (smoke). Every key must be consumed by the model adapter (strict):
# an unknown key is rejected before the study starts. The training budget is a declared part of the
# trial configuration. `noise` is deliberately absent: dropping the dynamics noise of a
# stochastic-drift model is not a marginal-preserving sampler.
model: csbm
kind: smoke
version: 2
fixed:
  num_outer_iterations: 2
  epochs: 2
  num_steps: 6
  hidden_dim: 32
  n_layers: 3
  dropout: 0.1
  forward_weight_decay: 0.0001
  backward_weight_decay: 0.002
  emb_dim: 4
  time_dim: 16
  device: cpu
params:
  mixing_rate:
    type: float
    low: 0.5
    high: 4.0
    log: true
  forward_lr:
    type: float
    low: 0.001
    high: 0.003
    log: true
  backward_lr:
    type: float
    low: 0.004
    high: 0.01
    log: true
