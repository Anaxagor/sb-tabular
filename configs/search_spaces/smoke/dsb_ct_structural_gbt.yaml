# Search space for `dsb_ct_structural_gbt` (smoke). Every key must be consumed by the model adapter (strict):
# an unknown key is rejected before the study starts. The training budget is a declared part of the
# trial configuration. `noise` is deliberately absent: dropping the dynamics noise of a
# stochastic-drift model is not a marginal-preserving sampler.
model: dsb_ct_structural_gbt
kind: smoke
version: 1
fixed:
  horizon: null  # tune the raw gamma schedule, preserving this search space
  cb_iterations: 10
  cb_depth: 2
  cb_thread_count: 2
  gamma_min: 0.01
  schedule: geom
  num_steps: 3
  ipf_iters: 1
params:
  gamma_max:
    type: float
    low: 0.05
    high: 0.2
    log: true
  n_bins:
    type: categorical
    choices:
    - 3
    - 5
