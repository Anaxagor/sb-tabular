# Search space for `ve_score_sde_simplified` (smoke). Every key must be consumed by the model adapter (strict):
# an unknown key is rejected before the study starts. The training budget is a declared part of the
# trial configuration.
model: ve_score_sde_simplified
kind: smoke
version: 1
fixed:
  steps: 60
  batch_size: 64
  hidden_dim: 32
  n_layers: 2
  time_emb_dim: 16
  n_sampling_steps: 20
  device: cpu
params:
  lr:
    type: float
    low: 0.001
    high: 0.01
    log: true
