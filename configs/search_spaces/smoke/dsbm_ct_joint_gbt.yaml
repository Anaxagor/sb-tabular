# Search space for `dsbm_ct_joint_gbt` (smoke). Every key must be consumed by the model adapter (strict):
# an unknown key is rejected before the study starts. The training budget is a declared part of the
# trial configuration. `noise` is deliberately absent: dropping the dynamics noise of a
# stochastic-drift model is not a marginal-preserving sampler.
model: dsbm_ct_joint_gbt
kind: smoke
version: 1
fixed:
  n_stages: 3
  num_steps: 6
  n_noise_per_pair: 1
  cb_iterations: 10
  cb_depth: 2
  cb_thread_count: 2
params:
  sigma:
    type: float
    low: 0.1
    high: 1.0
    log: true
  cb_learning_rate:
    type: float
    low: 0.1
    high: 0.3
