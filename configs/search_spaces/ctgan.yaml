# Search space for `ctgan` (production). Every key must be consumed by the model adapter (strict):
# an unknown key is rejected before the study starts. The training budget is a declared part of the
# trial configuration.
model: ctgan
kind: production
version: 1
fixed:
  enable_gpu: false
  discriminator_steps: 1
params:
  epochs:
    type: int
    low: 50
    high: 500
    step: 50
  batch_size:
    type: categorical
    choices:
    - 256
    - 512
    - 1024
  pac:
    type: categorical
    choices:
    - 1
    - 2
    - 4
    - 8
  embedding_dim:
    type: categorical
    choices:
    - 64
    - 128
    - 256
  generator_width:
    type: categorical
    choices:
    - 128
    - 256
    - 512
  discriminator_width:
    type: categorical
    choices:
    - 128
    - 256
    - 512
  generator_lr:
    type: float
    low: 0.0001
    high: 0.0005
    log: true
  discriminator_lr:
    type: float
    low: 0.0001
    high: 0.0005
    log: true
