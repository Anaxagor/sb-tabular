# Joint MLP TabVFM/TabbyFlow. The OT path keeps its standard Gaussian source
# and the reference implementation's residual endpoint noise of 0.001.
model: tabbyflow
kind: production
version: 1
fixed:
  cond_vel: ot
  ode_solver: euler
  weight_decay: 0.0
  scheduler_factor: 0.9
  scheduler_patience_epochs: 20
  early_stopping_patience_epochs: 200
  sample_batch_size: 512
  device: cpu
params:
  max_train_steps:
    type: categorical
    choices: [2000, 5000, 10000]
  n_frequencies:
    type: categorical
    choices: [128, 256, 512]
  batch_size:
    type: categorical
    choices: [256, 512, 1024]
  lr:
    type: float
    low: 0.0001
    high: 0.002
    log: true
  ode_steps:
    type: categorical
    choices: [50, 100, 200]
