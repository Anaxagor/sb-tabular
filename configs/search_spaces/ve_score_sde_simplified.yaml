# Search space for `ve_score_sde_simplified` (production). Every key must be consumed by the model adapter (strict):
# an unknown key is rejected before the study starts. The training budget is a declared part of the
# trial configuration.
model: ve_score_sde_simplified
kind: production
version: 1
fixed:
  device: cpu
  time_curriculum: false
params:
  steps:
    type: categorical
    choices:
    - 5000
    - 10000
    - 20000
  lr:
    type: float
    low: 0.0001
    high: 0.002
    log: true
  batch_size:
    type: categorical
    choices:
    - 256
    - 512
    - 1024
  hidden_dim:
    type: categorical
    choices:
    - 128
    - 256
    - 512
  sigma_max:
    type: float
    low: 5.0
    high: 50.0
    log: true
  n_sampling_steps:
    type: categorical
    choices:
    - 500
    - 1000
