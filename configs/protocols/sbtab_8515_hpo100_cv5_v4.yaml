# Canonical experiment contract. v1-v3 remain frozen for artifact provenance.
version: sbtab.protocol/2
protocol_id: sbtab_8515_hpo100_cv5_v4
supersedes: sbtab_8515_hpo100_cv5_v3
kind: production

# This explicitly authorized dataset definition precedes splitting. It removes
# rare feature values AND rare target classes; eligibility_report.json records
# removed row IDs and task_changed. Filtering is identical for every model.
eligibility:
  min_value_count: 3
  columns: finite_support
  iterate_to_fixed_point: true

split:
  test_size: 0.15
  random_state: 5
  stratify: true
  regression_strata_bins: 10
  pool_order: sorted_row_id
  # Target stratification alone cannot guarantee feature-category coverage.
  # Deterministic same-stratum swaps preserve sizes, rows and stratum counts;
  # their audit is replayed. Unresolved support failures block the dataset.
  support_repair:
    method: stratum_swap/1
    validation_coverage: blocking_columns
    max_swaps: 128
    max_candidate_evaluations: 8192

preprocessing:
  tuning_fit_population: T
  cv_fit_population: train_fold

tuning:
  n_trials: 100 # allocated Optuna records, including failed attempts
  direction: minimize
  sampler: tpe
  sampler_seed: 5
  n_jobs: 1
  pruner: none
  checkpoint_retention: all
  n_generated: len_validation

cv:
  population: T
  n_splits: 5
  shuffle: true
  random_state: 42
  n_generated: len_train_fold

seeds:
  base: 5

metrics_config: configs/metrics/metrics_v2.yaml

statistical_note: >-
  Fixed-hyperparameter cross-validation after dataset-level tuning; NOT nested CV.
  V selects hyperparameters. Tuning candidates train on all T, so CV test rows E_k
  took part in training the candidates used for selection. CV on T is not an
  independent outer evaluation of the tuning procedure. The initial stratified
  sklearn.train_test_split uses seed 5; deterministic same-stratum support repair
  may change its membership, preserving every eligible row and both stratum counts.
  CV is exactly sklearn.KFold(5, shuffle=True, random_state=42) on sorted repaired T.
  No E_k row is moved into its training fold. Preprocessors fit only T during
  tuning and only T_k during CV. TSTR and TRTR use the same default CatBoost
  estimator, seed and feature handling under the pinned metrics configuration.
