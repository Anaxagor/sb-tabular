name: Benchmark contracts

on:
  pull_request:
    paths:
      - ".github/workflows/benchmark-contracts.yml"
      - "docs/benchmark-contract.md"
      - "sbtab/benchmark/**"
      - "tests/benchmark/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/benchmark-contracts.yml"
      - "docs/benchmark-contract.md"
      - "sbtab/benchmark/**"
      - "tests/benchmark/**"

permissions:
  contents: read

jobs:
  contract-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install contract dependencies
        run: python -m pip install "numpy>=1.26" "pandas>=2.2"

      - name: Run contract tests
        run: >-
          python -m unittest
          tests.benchmark.test_contracts
          tests.benchmark.test_import_boundaries
          tests.benchmark.test_online_shoppers
